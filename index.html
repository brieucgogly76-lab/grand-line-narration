<!DOCTYPE html>

<head>
<script>
(function () {
  if (!window.storage) {
    window.storage = {
      async get(key) {
        try {
          const value = localStorage.getItem(key);
          return value === null ? null : value;
        } catch (e) {
          return null;
        }
      },
      async set(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (e) {
          return false;
        }
      },
      async remove(key) {
        try {
          localStorage.removeItem(key);
          return true;
        } catch (e) {
          return false;
        }
      }
    };
  }
})();
</script>

<title>Grand Line Legend XIII</title>
<style>
  :root{

  .float-text{ position:absolute; left:50%; top:38%; transform:translateX(-50%); font-weight:700; font-size:16px; pointer-events:none; z-index:60;

<script>
const $ = s => document.querySelector(s);
const frame = $('#frame'); const content = $('#content');
// Transition "page qui tourne" automatique à chaque changement d'écran
new MutationObserver(()=>{ content.classList.remove('page-flip'); void content.offsetWidth; content.classList.add('page-flip'); })
  .observe(content, {childList:true});

// ===== FILET DE SÉCURITÉ GLOBAL =====
// Si une erreur inattendue bloque le jeu (écran figé, boutons morts), ce bouton de secours
// permet de toujours reprendre la partie sans jamais perdre la sauvegarde.
let recoveryArme = false;
function afficherRecovery(){
  if(document.getElementById('recoveryBtn')) return;
  const btn = document.createElement('button');
  btn.id = 'recoveryBtn';
  btn.textContent = '⚠️ Écran bloqué ? Toucher ici pour continuer';
  btn.style.cssText = 'position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:99999; background:#8f2d2d; color:#fff; border:none; padding:12px 22px; border-radius:22px; font-size:12px; font-family:inherit; font-weight:700; box-shadow:0 4px 16px rgba(0,0,0,0.45); cursor:pointer;';
  btn.addEventListener('click', ()=>{
    btn.remove();
    document.querySelectorAll('.cinematique-overlay, .flash-veil, .combat-status-ic, .float-text').forEach(el=>el.remove());
    document.querySelectorAll('div[style*="z-index:70"], div[style*="z-index:75"]').forEach(el=>el.remove());
    try{
      combatCtx = null; navalCtx = null;
      if(state && state.evenementLong) state.evenementLong = null;
      if(state && state.sceneEnCours) state.sceneEnCours = null;
      if(state && state.vivant){ renderTour(null); } else { ecranDepart(); }
    }catch(e2){ try{ ecranDepart(); }catch(e3){} }
  });
  document.body.appendChild(btn);
}
window.addEventListener('error', function(){ afficherRecovery(); });
// Un bouton de secours discret apparaît aussi automatiquement si aucun clic n'aboutit à un
// changement d'écran pendant 8 secondes après une interaction (filet indépendant des erreurs JS).
let dernierChangementEcran = Date.now();
new MutationObserver(()=>{ dernierChangementEcran = Date.now(); const b=document.getElementById('recoveryBtn'); if(b) b.remove(); }).observe(content, {childList:true});
document.body.addEventListener('click', e=>{
  if(!e.target.closest('button')) return;
  setTimeout(()=>{ if(Date.now()-dernierChangementEcran > 4000) afficherRecovery(); }, 4200);
});

const rnd = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
// Choisit un élément en évitant de répéter ce qui vient d'être montré (mémoire courte, par catégorie)
function pickFrais(arr, poolName, memoire){
  memoire = memoire===undefined ? Math.max(2, Math.min(4, Math.floor(arr.length/3))) : memoire;
  state.recentPicks = state.recentPicks || {};
  const recent = state.recentPicks[poolName] || [];
  let dispo = arr.filter(x => !recent.includes(x));
  if(dispo.length===0) dispo = arr;
  const choisi = dispo[Math.floor(Math.random()*dispo.length)];
  state.recentPicks[poolName] = [choisi, ...recent].slice(0, memoire);
  return choisi;
}
const clamp = (v,mn,mx)=>Math.max(mn,Math.min(mx,v));

/* ===================== AUDIO (100% synthétisé, pas de fichiers) ===================== */
const AudioFX = (()=>{
  let ctx=null, musicOn=false, musicTimer=null, musicStep=0;
  function getCtx(){ if(!ctx){ ctx = new (window.AudioContext||window.webkitAudioContext)(); } if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function tone(freq,dur,type='sine',vol=0.18,delay=0){
    try{ const c=getCtx(); const o=c.createOscillator(); const g=c.createGain();
      o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
      const t0=c.currentTime+delay; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.02); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
      o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  }
  const arpeggio = [220,261.6,329.6,392,329.6,261.6];
  function musicTick(){
    if(!musicOn) return;
    const f = arpeggio[musicStep % arpeggio.length];
    tone(f, 1.1, 'sine', 0.035);
    tone(f/2, 1.4, 'triangle', 0.03);
    musicStep++;
  }
  return {
    coin(){ tone(880,0.08,'square',0.13); tone(1320,0.1,'square',0.1,0.06); },
    clash(){ tone(120,0.15,'sawtooth',0.18); tone(75,0.2,'square',0.14,0.05); },
    hit(){ tone(90,0.22,'square',0.22); },
    success(){ tone(523,0.1,'sine',0.14); tone(659,0.1,'sine',0.14,0.1); tone(784,0.16,'sine',0.14,0.2); },
    fail(){ tone(200,0.3,'sawtooth',0.16); tone(120,0.4,'sawtooth',0.14,0.15); },
    chest(){ tone(660,0.08,'triangle',0.14); tone(880,0.08,'triangle',0.14,0.08); tone(1100,0.14,'triangle',0.14,0.16); },
    legendaire(){ tone(784,0.14,'sine',0.16); tone(988,0.14,'sine',0.16,0.13); tone(1318,0.24,'sine',0.18,0.26); },
    death(){ tone(150,0.5,'sawtooth',0.22); tone(90,0.7,'sawtooth',0.18,0.2); },
    click(){ tone(340,0.035,'square',0.06); },
    fanfare(){ tone(523,0.12,'sine',0.15); tone(659,0.12,'sine',0.15,0.12); tone(784,0.12,'sine',0.15,0.24); tone(1046,0.22,'sine',0.16,0.36); },
    startMusic(){ if(musicTimer) return; musicOn=true; musicTimer=setInterval(musicTick, 900); },
    stopMusic(){ musicOn=false; if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
  };
})();
document.body.addEventListener('click', e=>{
  if(e.target.closest('button') && state && state.sonActif) AudioFX.click();
});

  ]};
}
function getActiveBranches(){
  if(!state.fruit) return SKILL_BRANCHES;
  if(!state._fruitBrancheCache || state._fruitBrancheCacheNom !== state.fruit.nom){
    state._fruitBrancheCache = buildFruitBranch(state.fruit);
    state._fruitBrancheCacheNom = state.fruit.nom;
  }
  const copy = {...SKILL_BRANCHES};
  delete copy.charisme;
  copy.fruit = state._fruitBrancheCache;
  return copy;
}
function getBranche(key){ return getActiveBranches()[key]; }
function skillAllNodes(brancheKey){ const b=getBranche(brancheKey); return b? b.rows.flat() : []; }
function skillNodeUnlocked(brancheKey, nodeId){
  const b = getBranche(brancheKey); if(!b) return false;
  state.competences[brancheKey] = state.competences[brancheKey] || {};
  const ri = b.rows.findIndex(r=>r.some(n=>n.id===nodeId));
  if(ri<=0) return true;
  return b.rows[ri-1].some(n => (state.competences[brancheKey][n.id]||0) > 0);
}
function skillPointsInvestis(brancheKey){
  state.competences[brancheKey] = state.competences[brancheKey] || {};
  return skillAllNodes(brancheKey).reduce((sum,n)=> sum + (state.competences[brancheKey][n.id]||0)*skillNodeCost(n), 0);
}

function startEvenementLong(){
  const def = pick(EVENEMENTS_LONGS); const lieu = pick(LIEUX_CALME); const duree = rnd(3,5);
  state.evenementLong = {def, lieu, jourActuel:1, duree, succes:0};
  ajouterLog(`Début — ${def.label} (${duree} jours).`);
}
function buildEvenementLong(){
  const ev = state.evenementLong;
  if(ev._texteCacheJour !== ev.jourActuel){
    ev._texteCache = ev.jourActuel===1 ? ev.def.intro(ev.lieu) : ev.def.jour(ev.jourActuel, ev.duree);
    ev._texteCacheJour = ev.jourActuel;
  }
  return { lieu:`${ev.def.label} — ${ev.lieu}`, texteHaut: ev._texteCache,
    choixHTML: ev.def.choix.map((c,i)=>`<button class="choix-btn" data-longchoice="${i}">${c.t}</button>`).join('') };
}
function resolverEvenementLong(i){
  const ev = state.evenementLong; const c = ev.def.choix[i]; const gain = c.fx(state);
  ev.succes += gain; ev.jourActuel++;
  if(ev.jourActuel>ev.duree){
    const msg = ev.def.fin(ev.succes); sfx('fanfare'); veil('gold');
    ajouterLog(`Fin — ${ev.def.label} : ${msg}`);
    state.evenementLong = null; avancerJour(); finirTour({txt:msg, bad:false});
  } else {
    avancerJour(); finirTour({txt:`${ev.def.label} : jour ${ev.jourActuel-1}/${ev.duree} passé.`, bad:false});
  }
}

function ouvrirRecrutement(){

  const bonusCharisme = ((state.competences.charisme?.ch6||0)>=1) ? 0.15 : 0;
  const chance = clamp(0.35+state.moral/25+Math.min(state.bounty+state.berry,3000)/6000+(state.voie?.id==='civil'?0.1:0)+bonusCharisme, 0.15,0.92);
  setScene('port');
  content.innerHTML = `

    <main class="scene-port">
      <div class="lieu">Une rencontre sur le port</div>
      <div style="text-align:center; margin:14px 0;"><div style="font-size:44px;">${candidatActuel.ic}</div>
        <div style="font-weight:700; font-size:15px;">${candidatActuel.nom}</div>
        <div style="font-size:11px; opacity:.65;">${candidatActuel.role}</div>
      </div>
      <div class="recit" style="text-align:center; font-style:italic;">${candidatActuel.blurb}</div>
      <div class="repere" style="text-align:center;">Chances qu'iel accepte de te suivre : ${Math.round(chance*100)}%</div>
      <div class="choix" style="margin-top:14px;">
        <button class="choix-btn" id="btnAccueillir">Proposer de rejoindre l'équipage</button>
        <button class="choix-btn" id="btnDeclinerRecrue">Le/la laisser poursuivre son chemin</button>
      </div>
    </main>`;
  $('#sonBtn')?.addEventListener('click', e=>{ e.stopPropagation(); toggleSon(); ouvrirRecrutement(); });
  $('#btnAccueillir').addEventListener('click', ()=>{
    const reussi = Math.random()<chance;
    let msg;
    if(reussi){
      const traitre = Math.random()<0.07;

}

const MAX_ARMES = 3;
const TYPES_ARME = ['sabre','lance','hache','tir','fleau','poing'];
function requiredPower(day, total){ const f = day/total; return Math.round(9 + Math.pow(f,1.25)*165); }
function armesBonusSum(s, key){ return s.equip.armes.reduce((sum,a)=> sum + (a.bonus[key]||0), 0); }
function vieMax(s){ return 100 + (s.equip.armure?.bonus.vie||0) + (s.equip.accessoire?.bonus.vie||0) + armesBonusSum(s,'vie'); }
function currentPower(s){
  const effF = s.force + armesBonusSum(s,'force') + (s.equip.accessoire?.bonus.force||0) + (s.equip.armure?.bonus.force||0);
  const effV = s.vitesse + armesBonusSum(s,'vitesse') + (s.equip.accessoire?.bonus.vitesse||0) + (s.equip.armure?.bonus.vitesse||0);
  const hakiAvg = (s.hakiObs+s.hakiArm+s.hakiCon)/3;
  const multiWieldBonus = s.equip.armes.length>=2 ? (s.equip.armes.length-1)*1.5 : 0;
  return Math.round(effF + effV*0.5 + s.maitrise*0.6 + hakiAvg + multiWieldBonus + (s.fruit?s.fruit.bonus+(s.fruitPower||0):0));
}
function eraName(day, total){
  const f=day/total;
  if(f<0.10) return "East Blue"; if(f<0.30) return "Paradise"; if(f<0.60) return "Nouveau Monde";
  if(f<0.90) return "Nouveau Monde — abysses"; return "Vers Laugh Tale";
}
function styleActuel(s){
  if(!s.equip.armes.length) return STYLES_ARME.poing;
  const counts={}; s.equip.armes.forEach(a=>counts[a.type]=(counts[a.type]||0)+1);
  const [type,n] = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const uniqueTypes = Object.keys(counts).length;
  const label = STYLES_ARME[type];
  if(s.equip.armes.length>1 && uniqueTypes===1) return `${label} (×${s.equip.armes.length})`;
  if(s.equip.armes.length>1) return `${label} mixte`;
  return label;
}
function gainAffinite(k,n){ if(k && state.affinites[k]!==undefined) state.affinites[k]+=n; }
function setFlag(k,v){ state.flags[k]=v===undefined?true:v; }
function hasFlag(k){ return !!state.flags[k]; }
// Berry = argent dépensable. Prime/renommée = selon la voie choisie, comme dans l'anime.
function primeLabel(s){ const id=s.voie?.id; if(id==='marine') return "Grade"; if(id==='chasseur'||id==='civil') return "Réputation"; return "Prime"; }
function gainRecompense(valeur){
  const id = state.voie?.id;
  if(id==='pirate' || id==='revolutionnaire'){
    const b = Math.round(valeur*0.35);
    state.bounty += valeur; state.berry += b;
    return {prime:valeur, berry:b};
  }
  const mult = id==='chasseur' ? 1.3 : 1.0;
  const b = Math.round(valeur*mult);
  state.bounty += Math.round(valeur*0.2); state.berry += b;
  return {prime:Math.round(valeur*0.2), berry:b};
}
function scoreFinal(s){ return s.bounty + s.berry*0.4; }
function prixActuel(baseCost){ const f = state.day/state.totalDays; const mult = 1 + f*2.4; return Math.round(baseCost*mult); }
function xpForNiveau(n){ return Math.round(40*Math.pow(n,1.5)); }
function gainXP(n){
  if(n<=0) return;
  state.xp += n;
  while(state.xp>=xpForNiveau(state.niveau+1)){
    state.niveau++; state.pointsCompetence++;
    ajouterLog(`Niveau ${state.niveau} atteint ! +1 point de compétence.`); sfx('fanfare');
    notifyLevelUp(state.niveau);
  }
}

}

/* ===================== ÉCRAN DE COMPÉTENCES (arbre façon capture) ===================== */
function peutAcheterNode(brancheKey, nodeId){
  const branche = getBranche(brancheKey); if(!branche) return false;
  if(branche.requiresHaki && !(state.hakiObsUnlocked||state.hakiArmUnlocked)) return false;
  const node = skillAllNodes(brancheKey).find(n=>n.id===nodeId); if(!node) return false;
  state.competences[brancheKey] = state.competences[brancheKey] || {};
  const niv = state.competences[brancheKey][nodeId]||0;
  if(niv>=node.max) return false;
  if(!skillNodeUnlocked(brancheKey,nodeId)) return false;
  return state.pointsCompetence >= skillNodeCost(node);
}
function raisonBlocage(brancheKey, nodeId){
  const branche = getBranche(brancheKey);
  if(branche.requiresHaki && !(state.hakiObsUnlocked||state.hakiArmUnlocked)) return "Ton Haki n'est pas encore éveillé.";
  const node = skillAllNodes(brancheKey).find(n=>n.id===nodeId);
  const niv = state.competences[brancheKey][nodeId]||0;
  if(niv>=node.max) return "Compétence déjà au niveau maximum.";
  if(!skillNodeUnlocked(brancheKey,nodeId)) return "Débloque d'abord un nœud de la rangée précédente.";
  if(state.pointsCompetence < skillNodeCost(node)) return `Il te manque des points (${skillNodeCost(node)} requis, tu en as ${state.pointsCompetence}).`;
  return null;
}
function acheterNode(brancheKey, nodeId){
  if(!peutAcheterNode(brancheKey, nodeId)) return;
  const node = skillAllNodes(brancheKey).find(n=>n.id===nodeId);
  const cout = skillNodeCost(node);
  state.pointsCompetence -= cout;
  state.competences[brancheKey][nodeId] = (state.competences[brancheKey][nodeId]||0)+1;
  for(const k in node.bonus||{}){ if(k==='vieBonus'){ state._compVieBonus=(state._compVieBonus||0)+node.bonus.vieBonus; } else { state[k]=clamp((state[k]||0)+node.bonus[k],0,999); } }
  sfx('fanfare'); veil('gold');
  ajouterLog(`Compétence : ${node.label} (${getBranche(brancheKey).label}) — ${state.competences[brancheKey][nodeId]}/${node.max}.`);
  renderCompetences();
}

      </div>
      ${verrouillee ? `<div class="repere" style="text-align:center; padding:20px;">🔒 Cette branche s'ouvrira quand ton Haki s'éveillera — un événement rare, à mériter en mer.</div>` : `
      <div class="skill-branch-wrap" style="--nodecolor:${branche.color};">
        ${branche.rows.map((row,ri)=>`

              return `<div class="skill-node">

        </div></div>
        <div class="skill-detail-desc">${Object.entries(selNode.bonus||{}).map(([k,v])=>`+${v} ${({force:'Force',vitesse:'Vitesse',maitrise:'Maîtrise',vieBonus:'Vie max',moral:'Moral',berry:'Berry',hakiObs:'Haki Observation',hakiArm:'Haki Armement',hakiCon:'Haki des Rois',fruitPower:'Puissance du Fruit'})[k]||k}`).join(' · ')}${selNode.move?` — ${selNode.move.nom}`:''}</div>
        ${selMaxed ? `<div class="skill-detail-status ok">✓ Compétence maîtrisée</div>`
          : selDispo ? `<button class="choix-btn" id="btnDebloquer" style="border-color:${branche.color};">Débloquer — coût ${skillNodeCost(selNode)} pt${skillNodeCost(selNode)>1?'s':''}</button>`
          : `<div class="skill-detail-status">🔒 ${selBlocage}</div>`}
      </div>`}
      <div class="ff-row" style="margin-top:14px;"><button class="ff-btn" id="retourTour">← Retour</button></div>
    </main>`;
  $('#sonBtn')?.addEventListener('click', e=>{ e.stopPropagation(); toggleSon(); renderCompetences(); });
  document.querySelectorAll('[data-comptab]').forEach(el=>el.addEventListener('click',()=>{ ongletComp=el.dataset.comptab; renderCompetences(); }));

  const req = requiredPower(state.day, state.totalDays);
  const canonsEnnemi = rnd(1, Math.min(6, 1+Math.floor(req/40)));
  const vieMaxE = 60 + canonsEnnemi*40;
  const bounty = Math.round(vieMaxE*rnd(3,6));
  return { nom: pick(ENNEMIS)+" (navire pirate)", vieMax:vieMaxE, vie:vieMaxE, canons:canonsEnnemi, bounty, capitaineBase: Math.round(req*(0.7+Math.random()*0.4)) };
}
function startNavalCombat(){
  navalCtx = { enemy: genEnnemiNaval(), defBoost:0 };
  setScene('combat');
  renderNavalCombat();
}
function renderNavalCombat(){
  const e = navalCtx.enemy;
  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">🚢⚔️ Combat naval ${sonBtnHTML()}</div><div class="jour">Canons : ${state.navire.canons}</div></header>
    <main class="scene-combat">
      <div class="combat-wrap">

            <div class="cbar pv ${barreEtat(state.navire.vie,navireVieMax())}"><i style="width:${clamp(state.navire.vie/navireVieMax()*100,0,100)}%"></i></div>
            <div class="repere">${state.navire.vie}/${navireVieMax()} PV coque</div></div>
          <div class="combattant enemy"><div class="nom-c">${e.nom}</div>

          <button class="move-btn" id="navManoeuvre">🌀 Manœuvre<small>Réduit les dégâts subis</small></button>
          <button class="move-btn" id="navAborder">⚔️ Aborder<small>Combat rapproché</small></button>
        </div>
        <div class="perm-row" style="margin-top:8px;"><button class="perm-btn" id="navFuir">🏃 Fuir</button></div>
      </div>
    </main>`;
  $('#sonBtn')?.addEventListener('click', e2=>{ e2.stopPropagation(); toggleSon(); renderNavalCombat(); });
  $('#navTirer').addEventListener('click', navalTirer);
  $('#navManoeuvre').addEventListener('click', navalManoeuvre);
  $('#navAborder').addEventListener('click', navalAborder);
  $('#navFuir').addEventListener('click', navalFuir);
}
function navalEnemyTurn(){
  const e = navalCtx.enemy;
  let dmg = Math.round(e.canons*rnd(7,13));
  if(navalCtx.defBoost){ dmg=Math.round(dmg*(1-navalCtx.defBoost)); navalCtx.defBoost=0; }
  state.navire.vie = clamp(state.navire.vie-dmg,0,navireVieMax());
  shake(); hitFlash('player'); spawnFloat(`-${dmg} coque`,'#a13c3c');
  if(state.navire.vie<=0) return navalDefaite();
  renderNavalCombat();
  setTimeout(()=>{ const l=$('#navalLog'); if(l) l.textContent = `${e.nom} riposte : -${dmg} PV de coque.`; },60);
}
function navalTirer(){
  const e = navalCtx.enemy;
  const isCrit = Math.random()<0.15;
  let dmg = Math.round(state.navire.canons*rnd(8,15)); if(isCrit) dmg = Math.round(dmg*1.6);
  e.vie -= dmg; sfx('hit'); shake(); hitFlash('enemy'); triggerAttackFx('burst');
  spawnFloat(isCrit?`CRITIQUE ! -${dmg}`:`-${dmg}`, isCrit?'var(--or)':'var(--sang)');
  if(isCrit){ const els=document.querySelectorAll('.float-text'); const last=els[els.length-1]; if(last) last.classList.add('crit'); }
  $('#navalLog').textContent = `${isCrit?'💥 Bordée critique ! ':''}Bordée tirée : -${dmg} PV ennemis.`;
  if(e.vie<=0) return setTimeout(navalVictoire,400);
  setTimeout(navalEnemyTurn,500);
}
function navalManoeuvre(){
  navalCtx.defBoost = 0.5; sfx('success'); $('#navalLog').textContent = "Manœuvre d'évitement amorcée.";
  setTimeout(navalEnemyTurn,500);
}
function navalAborder(){
  const e = navalCtx.enemy; navalCtx = null;
  startCombat({nom:e.nom.replace(' (navire pirate)',''), enemyBase:e.capitaineBase}, {
    important:false, rewardBounty: e.bounty, moralDelta:1,
    onWin:()=>{ avancerJour(); }, onLose:()=>{ avancerJour(); }
  });
}
function navalFuir(){
  const chance = clamp(0.3+state.vitesse/50+(state.navire.taille==='sloop'?0.15:0),0.1,0.9);
  if(Math.random()<chance){ sfx('success'); navalCtx=null; setScene('calm'); avancerJour(); finirTour({txt:"Tu sèmes le navire ennemi dans la brume.", bad:false}); }
  else { sfx('fail'); $('#navalLog').textContent="Fuite manquée !"; navalEnemyTurn(); }
}
function navalVictoire(){
  const e = navalCtx.enemy;
  const r = gainRecompense(e.bounty);
  veil('gold'); sfx('coin'); spawnFloat(`+₿${r.berry}`,'var(--sang)');
  ajouterLog(`Navire ennemi coulé — ${primeLabel(state)} +${r.prime||0}, Berry +${r.berry}.`);
  if(Math.random()<0.3){ const mat = pick(["Poudre Noire Purifiée","Acier Marin Raffiné","Bois Solide de Adam"]); state.materiaux[mat]=(state.materiaux[mat]||0)+1; ajouterLog(`Récupéré sur l'épave : ${mat}.`); }
  navalCtx = null; setScene('calm'); avancerJour();
  finirTour({txt:`Victoire navale ! +₿${r.berry}`, bad:false});
}
function navalDefaite(){
  veil('red'); sfx('fail');
  const perte = Math.round(state.berry*0.2); state.berry=Math.max(0,state.berry-perte);
  state.navire.vie = Math.max(5, Math.round(navireVieMax()*0.1));
  state.moral = clamp(state.moral-2,0,10);
  ajouterLog(`Le navire prend l'eau et s'échappe de justesse, coque en ruine. -₿${perte}.`);
  navalCtx = null; setScene('calm'); avancerJour();
  finirTour({txt:"Ta coque est en ruine — direction le premier port pour réparer.", bad:true});
}

function genererQuetes(){
  const req = requiredPower(state.day, state.totalDays);
  return [
    {titre:"Livraison discrète", desc:"Transporter une cargaison sensible sans encombre.", diff:0.85, recompense:Math.round(150+req*1.2)},
    {titre:"Chasse au déserteur", desc:"Retrouver un déserteur recherché par ses anciens compagnons.", diff:1.15, recompense:Math.round(220+req*1.7)},
    {titre:"Escorte marchande", desc:"Protéger un convoi contre des pirates locaux.", diff:1.0, recompense:Math.round(180+req*1.4)},
    {titre:"Collecte de renseignements", desc:"Soutirer des informations utiles dans les tavernes du coin.", diff:0.7, recompense:Math.round(100+req*0.9)}
  ];
}
function resolverQuete(q){
  const pp = currentPower(state);
  const seuil = requiredPower(state.day, state.totalDays)*q.diff;
  const chance = clamp(0.5+(pp-seuil)/120, 0.2, 0.92);
  const succes = Math.random()<chance;
  if(succes){
    const r = gainRecompense(q.recompense); gainXP(20); sfx('success'); veil('gold'); spawnFloat(`+₿${r.berry}`,'var(--sang)');
    ajouterLog(`Contrat rempli : ${q.titre}. +₿${r.berry}${r.prime?` • ${primeLabel(state)} +${r.prime}`:''}.`);
    const c = chestRoll(); if(c) ajouterLog(c);
  } else {
    state.moral = clamp(state.moral-1,0,10); sfx('fail');
    ajouterLog(`Contrat échoué : ${q.titre}. L'équipage rentre bredouille.`);
  }
  reagirEquipage();
  return succes;
}
/* ===================== CINÉMATIQUES ===================== */
function cinematique(lignes, callback){
  document.querySelectorAll('.cinematique-overlay').forEach(el=>el.remove());
  const overlay = document.createElement('div');
  overlay.className = 'cinematique-overlay';
  overlay.style.cssText = 'position:absolute; inset:0; z-index:75; display:flex; align-items:center; justify-content:center; flex-direction:column; background:rgba(4,10,18,0.95); padding:34px; text-align:center; cursor:pointer;';
  const txt = document.createElement('div');
  txt.style.cssText = 'font-size:15px; line-height:1.7; color:#ecdfc0; font-style:italic; max-width:480px;';
  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:10px; opacity:.45; margin-top:18px; text-transform:uppercase; letter-spacing:1px;';
  hint.textContent = 'Touche pour continuer';
  overlay.appendChild(txt); overlay.appendChild(hint); frame.appendChild(overlay);
  let i = 0; let fini = false;
  function terminer(){
    if(fini) return; fini = true;
    if(overlay.isConnected) overlay.remove();
    if(callback) callback();
  }
  function afficher(){ txt.textContent = lignes[i]; }
  afficher();
  overlay.addEventListener('click', ()=>{
    if(fini) return;
    i++;
    if(i>=lignes.length){ terminer(); return; }
    afficher();
  });
  // Filet de sécurité : la cinématique ne peut jamais bloquer le jeu plus de 15 secondes,
  // même si l'appli est mise en pause (arrière-plan, notification, etc.)
  setTimeout(terminer, 15000);
  shake();
}

function startSceneEvent(def){ state.sceneEnCours = {def, idx:0}; }
function buildSceneEvent(){
  const sc = state.sceneEnCours; const scene = sc.def.scenes[sc.idx];
  return { lieu: sc.def.lieu||'', texteHaut: scene.texte,
    choixHTML: scene.choix.map((c,i)=>`<button class="choix-btn ${c.risque?'risque':''}" data-scenechoice="${i}">${c.t}</button>`).join('') };
}
function resolverSceneEvent(i){
  const sc = state.sceneEnCours; const scene = sc.def.scenes[sc.idx]; const choix = scene.choix[i];
  const res = choix.fx ? choix.fx(state) : null;
  if(res) ajouterLog(res);
  const termine = choix.fin || (sc.idx+1 >= sc.def.scenes.length);
  if(termine){ state.sceneEnCours = null; reagirEquipage(); avancerJour(); finirTour({txt:res||"...", bad:!!choix.bad}); }
  else { sc.idx = (choix.next!==undefined) ? choix.next : sc.idx+1; finirTour({txt:res||"...", bad:!!choix.bad}); }
}

/* ===================== RIVAL RÉCURRENT ===================== */
const RIVAL_NOMS = ["Kessho","Dalgren","Ymir Roche","Sable Kurenai","Voss Aldric"];
const RIVAL_ETAPES = [0.12, 0.28, 0.48, 0.7, 0.88];
function initRival(){ if(!state.rival) state.rival = { nom: pick(RIVAL_NOMS), rencontres:0, statut:'inconnu', forceMult:0.85 }; }
function checkRivalScripted(){
  initRival(); const r = state.rival;
  if(r.rencontres>=RIVAL_ETAPES.length) return null;
  const seuil = Math.round(RIVAL_ETAPES[r.rencontres]*state.totalDays);
  if(state.day < seuil) return null;
  const c = buildRivalEncounter(); c._type='rival'; return c;
}
function lancerCombatRival(mult, important){
  const r = state.rival; const req = requiredPower(state.day, state.totalDays);
  startCombat({nom:r.nom, enemyBase:Math.round(req*r.forceMult*mult)}, {
    important: !!important, rewardBounty: Math.round(300+req*1.6*mult), moralDelta:2,
    onWin:()=>{ r.statut='vaincu'; avancerJour(); }, onLose:()=>{ avancerJour(); }
  });
}
function buildRivalEncounter(){
  const r = state.rival; const idx = r.rencontres;
  if(idx===0) return { lieu:"Une taverne animée",
    texte:`Un pirate au regard perçant s'installe face à toi. « On m'appelle ${r.nom}. J'ai beaucoup entendu parler de toi... et je voulais voir ça de mes propres yeux. »`,
    choix:[
      {t:"Le saluer avec respect", action:s=>{ r.statut='respect'; return {txt:`${r.nom} hoche la tête, satisfait(e). Une rivalité saine s'installe.`, bad:false}; }},
      {t:"Le défier du regard", action:s=>{ r.statut='rivalite'; return {txt:`${r.nom} sourit, amusé(e) par ton audace. « On se reverra. »`, bad:false}; }},
      {t:"L'ignorer superbement", action:s=>{ r.statut='mepris'; return {txt:`${r.nom} plisse les yeux, visiblement vexé(e).`, bad:true}; }}
    ]};
  if(idx===1) return { lieu:"Un port animé",
    texte: r.statut==='mepris' ? `${r.nom} te barre la route, hostile. « Tu te souviens de moi ? Cette fois, tu ne m'ignoreras pas. »`
      : `${r.nom} réapparaît, plus fort(e) qu'avant. « Alors, prêt(e) à voir qui de nous deux ira le plus loin ? »`,
    choix:[
      {t:"Accepter un duel amical", action:s=>{ r.forceMult+=0.1; const g=rnd(100,250); s.berry+=g; return {txt:`Un combat intense mais fair-play. +₿${g} pariés sur le duel.`, bad:false}; }},
      {t:"Proposer une trêve", action:s=>{ if(r.statut==='mepris') r.statut='rivalite'; s.moral=clamp(s.moral+1,0,10); return {txt:`${r.nom} accepte, surpris(e) par ta proposition.`, bad:false}; }},
      {t:"Refuser tout contact", action:s=>{ r.statut='hostilite'; s.moral=clamp(s.moral-1,0,10); return {txt:`${r.nom} tourne les talons, glacial(e).`, bad:true}; }}
    ]};
  if(idx===2){
    const hostile = r.statut==='mepris'||r.statut==='hostilite';
    return { lieu:"Une île contestée",
      texte: hostile ? `${r.nom} et son équipage bloquent ta route. « Cette fois, on règle ça pour de bon. »`
        : `${r.nom} te propose une alliance temporaire contre une menace commune.`,
      choix: hostile ? [
        {t:"Affronter directement", action:s=>{ lancerCombatRival(1.0); }},
        {t:"Tenter une réconciliation", action:s=>{ if(Math.random()<0.5){ r.statut='rivalite'; return {txt:`${r.nom} baisse sa garde, surpris(e) par ta sincérité.`, bad:false}; } return {txt:`${r.nom} refuse net.`, bad:true}; }}
      ] : [
        {t:"Accepter l'alliance", action:s=>{ r.statut='allie'; const g=rnd(150,300); s.berry+=g; return {txt:`Ensemble, vous repoussez la menace. +₿${g}`, bad:false}; }},
        {t:"Refuser, chacun sa route", action:s=>{ r.statut='rivalite'; return {txt:`${r.nom} respecte ton choix.`, bad:false}; }}
      ]};
  }
  if(idx===3){
    const allie = r.statut==='allie';
    return { lieu:"Un affrontement inattendu",
      texte: allie ? `${r.nom} te propose de rejoindre officiellement ton équipage.` : `${r.nom} revient, plus déterminé(e) que jamais à te dépasser.`,
      choix: allie ? [
        {t:"L'accueillir dans l'équipage", action:s=>{ s.crewMembers.push({nom:r.nom, role:"Rival devenu allié", traitre:false}); r.statut='crewmate'; return {txt:`${r.nom} rejoint officiellement l'équipage !`, bad:false}; }},
        {t:"Rester séparés, alliés de circonstance", action:s=>({txt:"Vous continuez chacun votre route, en bons termes.", bad:false})}
      ] : [
        {t:"Se mesurer une nouvelle fois", action:s=>{ lancerCombatRival(1.15); }},
        {t:"Le laisser filer", action:s=>({txt:"Vous vous croisez sans un mot, chacun conscient de la tension.", bad:false})}
      ]};
  }
  // idx === 4 : finale
  const crewmate = r.statut==='crewmate';
  return { lieu:"Le duel final", texte:`Après tout ce chemin parcouru ensemble, ${r.nom} et toi savez que cette rencontre sera décisive.`,
    choix: crewmate ? [
      {t:"Combattre côte à côte contre une menace commune", action:s=>{ const g=rnd(400,700); s.berry+=g; gainXP(60); return {txt:`Ensemble, invincibles. +₿${g}`, bad:false}; }}
    ] : [
      {t:"L'affronter une dernière fois", action:s=>{
        cinematique([`Le vent se lève.`, `${r.nom} dégaine, le regard chargé de tout ce que vous avez traversé.`, `« Une dernière fois, capitaine. »`],
          ()=>lancerCombatRival(1.3, true));
      }}
    ]};
}

/* ===================== ARC NARRATIF : LE FANTÔME DE GRAND LINE ===================== */
const ARC_FANTOME_SEUILS = [0.18, 0.34, 0.5, 0.66, 0.82];
function checkArcNarratifScripted(){
  for(let i=0;i<ARC_FANTOME_SEUILS.length;i++){
    const cle = 'fantome_ch'+i;
    if(hasFlag(cle)) continue;
    if(state.day < Math.round(ARC_FANTOME_SEUILS[i]*state.totalDays)) return null;
    return buildFantomeChapitre(i, cle);
  }
  return null;
}

      {t:"⚔️ La détruire", action:s=>{ setFlag(cle); setFlag('fantome_fin','detruite'); const g=rnd(500,900); const r=gainRecompense(g); gainXP(80); return {txt:`Un chapitre entier de l'ombre de Grand Line s'éteint avec elle. +₿${r.berry}`, bad:false}; }},

}

/* ===================== ÉVÉNEMENTS SPÉCIAUX (unifié) ===================== */
function checkEvenementSpecial(){ return checkRivalScripted() || checkArcNarratifScripted() || checkLegendaireScripted(); }
function resolverEvenementSpecial(contenu, i){
  const choix = contenu.choix[i];
  if(contenu._type==='rival' && state.rival) state.rival.rencontres++;
  const result = choix.action(state);
  if(result === undefined) return;
  reagirEquipage();
  avancerJour();
  finirTour(result);
}

function genEncounter(){
  const req = requiredPower(state.day, state.totalDays);
  const enemyBase = Math.round(req*(0.6+Math.random()*0.5));
  const enemyBounty = Math.round(enemyBase*rnd(10,18));
  const lieu = pickFrais(LIEUX_CALME,'lieuxRencontre'); const nom = pickFrais(ENNEMIS,'nomsEnnemis'); const adj = pick(ADJ_ENNEMI);
  const texte = pickFrais(ENCOUNTER_TPL,'templatesRencontre')(lieu, adj, nom, enemyBounty);
  return { type:'encounter', lieu, enemyBase, enemyBounty, nom, texte };
}

function nextArc(){
  if(state.arcsFaits>=ARCS.length) return null;
  const a = ARCS[state.arcsFaits]; const seuil = Math.round(a.frac*state.totalDays);
  return state.day>=seuil ? a : null;
}

/* ===================== TRAITRES ===================== */
function checkTraitorEvent(){
  const traitres = state.crewMembers.filter(m=>m.traitre);
  if(traitres.length && state.moral<=6 && Math.random()<0.02){
    const t = pick(traitres);
    const perte = Math.round(state.berry*0.2);
    state.berry = Math.max(0, state.berry-perte);
    state.crewMembers = state.crewMembers.filter(m=>m!==t);
    if(state.sac.length && Math.random()<0.5){ state.sac.shift(); }
    state.moral = clamp(state.moral-2,0,10);
    ajouterLog(`⚠️ Trahison ! ${t.nom} s'enfuit dans la nuit avec ₿${perte} et une part du butin.`);
    sfx('fail'); veil('red'); reagirEquipage();
  }
}

/* ===================== GACHA / COFFRES ===================== */
function rollRarete(){
  const bonus = (metaUpgrades.chance||0)*0.015;
  const r = Math.random();
  if(r<0.04+bonus*0.5) return 'legendaire'; if(r<0.17+bonus*0.8) return 'epique'; if(r<0.45+bonus) return 'rare'; return 'commune';
}
function chestRoll(){
  if(Math.random()>=0.32) return null;
  const rarete = rollRarete();
  sfx(rarete==='legendaire'?'legendaire':'chest');
  if(rarete!=='legendaire' && Math.random()<0.18){
    const mat = pick(MATERIAUX); state.materiaux[mat] = (state.materiaux[mat]||0)+1;
    showGacha(rarete, mat, '🧱'); return `Coffre (${rarete}) : matériau — ${mat}.`;
  }
  if(rarete==='commune' || Math.random()<0.4){
    const mult = {commune:1,rare:2.2,epique:4,legendaire:8}[rarete];
    const g = Math.round(rnd(80,220)*mult); state.berry+=g;
    showGacha(rarete, `₿${g}`, '💰'); return `Coffre (${rarete}) : ₿${g}.`;
  }
  if(rarete==='legendaire' && state.poneglyphes.length<PONEGLYPHES_NOMS.length && Math.random()<0.22){
    const restants = PONEGLYPHES_NOMS.filter(n=>!state.poneglyphes.includes(n));
    const frag = pick(restants); state.poneglyphes.push(frag);
    showGacha('legendaire', frag, '🗿');
    const complet = state.poneglyphes.length>=PONEGLYPHES_NOMS.length;
    if(complet){ ajouterLog("Tous les fragments de Poneglyphe sont réunis — un chemin vers la vérité s'ouvre enfin."); gainXP(100); }
    return `Coffre légendaire : ${frag} ! (${state.poneglyphes.length}/${PONEGLYPHES_NOMS.length})`;
  }
  if(rarete==='legendaire' && Math.random()<0.35){
    const fruitsPossibles = FRUITS.filter(f=>f.rarete==='legendaire'||f.rarete==='epique');
    const f = pick(fruitsPossibles); ajouterFruitAuSac(f);
    showGacha('legendaire', f.nom, '🍈'); return `Coffre légendaire : ${f.nom} ! (rangé dans ton sac)`;
  }
  const pools = {commune:[...ARMES,...ARMURES,...ACCESSOIRES].filter(i=>i.rarete==='commune'),
    rare:[...ARMES,...ARMURES,...ACCESSOIRES].filter(i=>i.rarete==='rare'),
    epique:[...ARMES,...ARMURES,...ACCESSOIRES].filter(i=>i.rarete==='epique'),
    legendaire:[...ARMES,...ARMURES,...ACCESSOIRES].filter(i=>i.rarete==='legendaire')};
  let pool = pools[rarete]; if(!pool.length) pool = pools.commune;
  const item = pick(pool);
  const icOb = ARMES.includes(item)?'⚔️':(ARMURES.includes(item)?'🛡️':'💍');
  if(state.sac.length>=10){ state.berry += Math.round(state.sac[0].cost/2); state.sac.shift(); }
  state.sac.push(item); showGacha(rarete, item.nom, icOb);
  return `Coffre (${rarete}) : ${item.nom}.`;
}
function showGacha(rarete, label, icone){
  icone = icone || '🎁';
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:absolute; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; flex-direction:column; background:rgba(8,25,44,0.82); backdrop-filter:blur(3px); pointer-events:none;';
  const rayonsEl = document.createElement('div'); rayonsEl.className='chest-rayons';
  const chestEl = document.createElement('div'); chestEl.className='chest-anim'; chestEl.textContent='📦'; chestEl.style.position='relative'; chestEl.style.zIndex='2';
  const cardEl = document.createElement('div'); cardEl.className=`gacha-card gc-${rarete}`; cardEl.style.zIndex='2';
  cardEl.innerHTML = `<span class="gacha-item-ic">${icone}</span>${label}<br><small style="font-size:10px; text-transform:uppercase; opacity:.7;">${rarete}</small>`;
  overlay.appendChild(rayonsEl); overlay.appendChild(chestEl); overlay.appendChild(cardEl);
  frame.appendChild(overlay);
  setTimeout(()=>{ chestEl.classList.add('open'); shake(); },550);
  setTimeout(()=>{
    cardEl.classList.add('show');
    for(let i=0;i<8;i++){
      const p = document.createElement('div'); p.className='chest-particule'; p.textContent = pick(['✨','⭐','💫']);
      const angle = (i/8)*Math.PI*2; const dist = 70+Math.random()*30;
      p.style.setProperty('--fly', `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`);
      p.style.left='50%'; p.style.top='38%'; p.style.animationDelay=(Math.random()*0.15)+'s';
      overlay.appendChild(p);
    }
  },900);
  setTimeout(()=>{ overlay.style.transition='opacity .4s ease'; overlay.style.opacity='0'; setTimeout(()=>overlay.remove(),400); }, 2800);
}

const MOVE_PAR_TYPE = {
  sabre:{nom:"Tranchant Lame", power:16, ic:"🗡️", fx:'slash'}, lance:{nom:"Estoc Perçant", power:15, ic:"🔱", fx:'fleche'},
  hache:{nom:"Fracas Brutal", power:17, ic:"🪓", fx:'slash'}, tir:{nom:"Tir Précis", power:15, ic:"🎯", fx:'fleche'},
  fleau:{nom:"Rotation Écrasante", power:17, ic:"⛓️", fx:'slash'}, poing:{nom:"Combo Poings", power:12, ic:"👊", fx:'burst'}
};
function getPlayerMoves(){
  const moves = [{nom:"Coup rapide", power:8, ic:"👊", fx:'slash'}];
  moves.push({nom:"Parade", power:0, parry:true, ic:"🛡️"});
  const armes = state.equip.armes;
  if(!armes.length){ moves.push(MOVE_PAR_TYPE.poing); }
  else {
    const vus = new Set();
    armes.forEach(a=>{ if(!vus.has(a.type)){ vus.add(a.type); moves.push(MOVE_PAR_TYPE[a.type]||MOVE_PAR_TYPE.poing); } });
    const counts={}; armes.forEach(a=>counts[a.type]=(counts[a.type]||0)+1);
    const maxN = Math.max(...Object.values(counts));
    if(maxN>=2) moves.push({nom:`Assaut Multi-Lames (×${maxN})`, power:14+maxN*6, ic:"⚔️", fx:'slash'});
  }
  if(state.fruit) moves.push({nom:`Pouvoir : ${state.fruit.nom.split(' ').slice(0,2).join(' ')}`, power:22, ic:"🍈", fx:'burst'});
  if(state.hakiArmUnlocked) moves.push({nom:"Coup Durci (Haki)", power:19, ic:"🌀", fx:'pulse'});
  if(state.hakiObsUnlocked) moves.push({nom:"Esquive Prédictive", power:0, defense:true, ic:"👁️"});
  if(state.hakiCon>0) moves.push({nom:"Vague de Volonté (Haki des Rois)", power:0, special:'conquerant', ic:"👑"});
  for(const brKey in getActiveBranches()){
    skillAllNodes(brKey).forEach(n=>{ if(n.move && (state.competences[brKey][n.id]||0)>=1) moves.push({...n.move, fx:n.move.fx||'burst'}); });
  }
  return moves.slice(0,7);
}
function triggerAttackFx(type){
  const wrap = document.querySelector('.combat-wrap'); if(!wrap) return;
  const fxWrap = document.createElement('div'); fxWrap.className='attack-fx';
  const inner = document.createElement('div'); inner.className = 'attack-'+(type||'slash');
  fxWrap.appendChild(inner); wrap.appendChild(fxWrap);
  setTimeout(()=>fxWrap.remove(), 600);
}
function hitFlash(side){
  const el = document.querySelector(side==='enemy' ? '.combattant.enemy' : '.combattant:not(.enemy)'); if(!el) return;
  el.classList.remove('hit-recoil'); void el.offsetWidth; el.classList.add('hit-recoil');
}
function showStatusIcon(icone, side){
  const wrap = document.querySelector('.combat-wrap'); if(!wrap) return;
  const el = document.createElement('div'); el.className='combat-status-ic'; el.textContent = icone;
  el.style.top = '10px'; el.style[side==='enemy'?'right':'left'] = '18px';
  wrap.appendChild(el); setTimeout(()=>el.remove(), 950);
}
function startCombat(enemy, opts){
  const req = requiredPower(state.day, state.totalDays);
  combatCtx = { enemy:{nom:enemy.nom, power:enemy.enemyBase||enemy.power, hpMax:100+Math.round((enemy.enemyBase||enemy.power)*0.8), hp:0,
      def:Math.round((enemy.enemyBase||enemy.power)*0.15), phase:0, resiste:null,
      moves:[{nom:"Attaque brute",mult:0.9},{nom:"Attaque sournoise",mult:1.1},{nom:"Rugissement féroce",mult:1.3}]},
    important: !!opts.important, rewardBounty: opts.rewardBounty, moralDelta: opts.moralDelta||1, onWin: opts.onWin, onLose: opts.onLose, label: enemy.nom,
    defBoost:0, combo:0, parryActive:false, styleUsage:{fruit:0, haki:0, physique:0} };
  combatCtx.enemy.hp = combatCtx.enemy.hpMax;
  setScene('combat'); renderCombat();
}
function categorieCoup(move){
  if(move.ic==='🍈') return 'fruit';
  if(move.special==='conquerant' || move.fx==='pulse' || (move.ic&&move.ic==='🌀')) return 'haki';
  return 'physique';
}
function enregistrerStyleCoup(move){
  const c = combatCtx; const cat = categorieCoup(move);
  c.styleUsage[cat] = (c.styleUsage[cat]||0)+1;
  if(!c.enemy.resiste && c.styleUsage[cat]>=3){
    c.enemy.resiste = cat;
    const noms = {fruit:"tes pouvoirs de Fruit", haki:"ton Haki", physique:"tes attaques physiques"};
    ajouterLog(`${c.label} commence à anticiper ${noms[cat]} !`);
    setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = `⚠️ ${c.label} a repéré ton habitude — ${noms[cat]} perdent en efficacité contre lui.`; }, 700);
  }
  return cat;
}
function checkBossPhase(){
  const c = combatCtx; if(!c || !c.important) return;
  const frac = c.enemy.hp/c.enemy.hpMax; if(frac<=0) return;
  const seuils = [0.7,0.4,0.15];
  if(c.enemy.phase < seuils.length && frac <= seuils[c.enemy.phase]){
    c.enemy.phase++;
    c.enemy.power = Math.round(c.enemy.power*1.15);
    const nomsPhase = ["Fureur Grandissante","Assaut Déchaîné","Rage Ultime"];
    c.enemy.moves.push({nom: nomsPhase[c.enemy.phase-1]||"Attaque Renforcée", mult: 1.3+c.enemy.phase*0.15});
    notifyBossPhase(`${c.label} entre dans une nouvelle phase — la menace grandit !`);
    sfx('fanfare'); veil('red'); shake();
  }
}
function renderCombat(){
  const c = combatCtx; const pp = currentPower(state) + (state._buffDmg?Math.round(state._buffDmg*0.4):0);
  const moves = getPlayerMoves();
  const consommables = state.sac.filter(it=>it.type==='potion'||it.type==='ration'||it.type==='buff');
  const noms = [...new Set(consommables.map(i=>i.nom))];
  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">⚔️ Combat ${sonBtnHTML()}</div><div class="jour">Puissance : ${pp}${state._buffDmg?' 🔥':''}${c.combo>=2?` • Combo ×${c.combo}`:''}</div></header>
    <main class="scene-combat">
      <div class="combat-wrap">
        <div class="vs-row">
          <div class="combattant"><div class="nom-c">${state.nom} (${styleActuel(state)})</div>
            <div class="cbar pv ${barreEtat(state.vie,vieMax(state))}"><i style="width:${clamp(state.vie/vieMax(state)*100,0,100)}%"></i></div>
            <div class="repere">${state.vie}/${vieMax(state)} vie</div></div>
          <div class="combattant enemy"><div class="nom-c">${c.label}${c.enemy.phase>0?` (phase ${c.enemy.phase+1})`:''}${c.enemy.resiste?` 🛡️`:''}</div>
            <div class="cbar ev ${barreEtat(c.enemy.hp,c.enemy.hpMax)}"><i style="width:${clamp(c.enemy.hp/c.enemy.hpMax*100,0,100)}%"></i></div>
            <div class="repere">${Math.max(0,c.enemy.hp)}/${c.enemy.hpMax} PV</div></div>
        </div>
        <div class="combat-log" id="combatLog"></div>
        <div class="moves-grid">
          ${moves.map((m,i)=>`<button class="move-btn" data-move="${i}">${m.ic} ${m.nom}<small>${m.parry?'Timing : bloque + contre-attaque':(m.defense?'Réduit les dégâts subis':(m.special==='conquerant'?'Étourdit ou affaiblit':'Puissance '+m.power))}</small></button>`).join('')}
        </div>
        ${noms.length ? `<div class="divider">Objets</div><div class="perm-row">
          ${noms.map(n=>`<button class="perm-btn" data-usecombat="${n}">🧪 ${n} (×${consommables.filter(i=>i.nom===n).length})</button>`).join('')}
        </div>` : ''}
        <div class="perm-row" style="margin-top:8px;">
          <button class="perm-btn" id="btnFuirCombat">🏃 Fuir le combat</button>
        </div>
      </div>
    </main>`;
  $('#sonBtn')?.addEventListener('click', e=>{ e.stopPropagation(); toggleSon(); renderCombat(); });
  document.querySelectorAll('[data-move]').forEach(btn=>btn.addEventListener('click',()=>playerAttack(parseInt(btn.dataset.move))));
  document.querySelectorAll('[data-usecombat]').forEach(btn=>btn.addEventListener('click',()=>usePotionInCombat(btn.dataset.usecombat)));
  $('#btnFuirCombat').addEventListener('click', tryFleeCombat);
}
const COMBAT_LOG_JOUEUR = [
  m=>`${m.nom} frappe de plein fouet !`, m=>`${m.nom} touche sa cible sans pitié !`,
  m=>`${m.nom} déchire la garde adverse !`, m=>`${m.nom} claque dans un bruit sourd !`
];
const COMBAT_LOG_ENNEMI = [
  (l,m)=>`${l} riposte avec ${m.nom} !`, (l,m)=>`${l} tente ${m.nom}, tu encaisses !`,
  (l,m)=>`${l} enchaîne avec ${m.nom} !`, (l,m)=>`${l} rugit et lance ${m.nom} !`
];
function playerAttack(idx){
  const moves = getPlayerMoves(); const move = moves[idx]; const c = combatCtx; const pp = currentPower(state);
  if(move.parry){ return playerParade(); }
  if(move.defense){ c.defBoost = 0.5; $('#combatLog').textContent = `Tu te concentres, prêt à esquiver.`; sfx('success'); setTimeout(enemyTurn, 500); return; }
  if(move.special==='conquerant'){
    const gap = pp - c.enemy.power;
    let msg;
    if(gap > c.enemy.power*0.3 || Math.random()<0.5){
      c.enemy.stunTurns = (c.enemy.stunTurns||0) + (gap>0?2:1);
      msg = "Ta volonté écrase l'adversaire — il reste figé de terreur !"; sfx('fanfare'); veil('gold'); spawnFloat('Étourdi !','var(--violet)');
      showStatusIcon('💫','enemy');
    } else {
      c.enemy.debuffTurns = (c.enemy.debuffTurns||0) + 2;
      msg = "Ton Haki des Rois ébranle l'adversaire, affaibli pour un temps."; sfx('success'); spawnFloat('Affaibli','var(--violet)');
      showStatusIcon('⬇️','enemy');
    }
    triggerAttackFx('pulse'); shake(); hitFlash('enemy');
    $('#combatLog').textContent = msg;
    setTimeout(enemyTurn, 600);
    return;
  }
  c.combo = (c.combo||0)+1;
  const comboMult = 1 + Math.min(c.combo-1,8)*0.08;
  const isCrit = Math.random()<0.15;
  const categorie = enregistrerStyleCoup(move);
  let dmg = Math.round((move.power + pp*0.55) * (0.85+Math.random()*0.3) - c.enemy.def) + (state._buffDmg||0);
  dmg = Math.round(dmg*comboMult);
  if(c.enemy.resiste===categorie) dmg = Math.round(dmg*0.72);
  if(isCrit) dmg = Math.round(dmg*1.6);
  dmg = Math.max(4, dmg);
  state._buffDmg = 0;
  c.enemy.hp -= dmg; sfx('hit'); shake(); hitFlash('enemy'); triggerAttackFx(move.fx||'slash');
  spawnFloat(isCrit?`CRITIQUE ! -${dmg}`:(c.enemy.resiste===categorie?`-${dmg} (résisté)`:`-${dmg}`), isCrit?'var(--or)':'var(--sang)');
  if(isCrit){ const els=document.querySelectorAll('.float-text'); const last=els[els.length-1]; if(last) last.classList.add('crit'); }
  if(c.combo>=2) setTimeout(()=>spawnFloat(`COMBO ×${c.combo} !`,'var(--violet)'), 180);
  checkBossPhase();
  $('#combatLog').textContent = `${isCrit?'💥 Coup critique ! ':''}${pickFrais(COMBAT_LOG_JOUEUR,'logJoueur')(move)} (-${dmg})${c.combo>=2?` [Combo ×${c.combo}]`:''}`;
  if(c.enemy.hp<=0) return setTimeout(endCombatVictory, 400);
  setTimeout(enemyTurn, 500);
}
function playerParade(){
  let pos=0, dir=1, running=true, startZ=rnd(28,52), zoneW=15;
  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">🛡️ Parade !</div></header>
    <main class="scene-combat">
      <div class="recit" style="text-align:center;">Clique « Parer » pile quand le curseur est dans la zone claire.</div>
      <div class="mini-bar" id="miniBar"><div class="mini-zone" style="left:${startZ}%; width:${zoneW}%;"></div><div class="mini-curseur" id="miniCurseur" style="left:0%;"></div></div>
      <div class="choix"><button class="choix-btn" id="btnParer">🛡️ Parer !</button></div>
    </main>`;
  const curseur = $('#miniCurseur');
  function loop(){ if(!running) return; pos+=dir*3.6; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;} curseur.style.left=pos+'%'; requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
  $('#btnParer').addEventListener('click', ()=>{
    running=false;
    const reussite = pos>=startZ && pos<=startZ+zoneW;
    const c = combatCtx;
    if(reussite){ c.parryActive = true; sfx('success'); }
    else { c.defBoost = 0.5; c.parryActive = false; sfx('fail'); }
    renderCombat();
    setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = reussite? "Parade parfaite — prêt(e) à contre-attaquer !" : "Parade ratée — tu bloques partiellement l'assaut."; },60);
    setTimeout(enemyTurn, 650);
  });
}
function enemyTurn(){
  const c = combatCtx;
  if(c.enemy.stunTurns>0){
    c.enemy.stunTurns--;
    showStatusIcon('💫','enemy');
    renderCombat();
    setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = `${c.label} reste figé, incapable d'agir !`; },60);
    return;
  }
  if(c.parryActive){
    c.parryActive = false;
    const move = pick(c.enemy.moves);
    let dmg = Math.round((move.mult*c.enemy.power)*(0.85+Math.random()*0.3));
    dmg = Math.max(1, Math.round(dmg*0.2) - Math.round(currentPower(state)*0.05));
    state.vie = clamp(state.vie-dmg,0,vieMax(state)); hitFlash('player'); spawnFloat(`-${dmg} vie`,'#a13c3c');
    const counterDmg = Math.round(currentPower(state)*0.5 + 12);
    c.enemy.hp -= counterDmg; hitFlash('enemy'); triggerAttackFx('burst'); shake(); sfx('hit');
    spawnFloat(`Contre ! -${counterDmg}`,'var(--or)'); showStatusIcon('🛡️','player');
    checkBossPhase();
    if(c.enemy.hp<=0) return setTimeout(endCombatVictory, 400);
    if(state.vie<=0) return endCombatDefeat();
    renderCombat();
    setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = `Parade parfaite ! Tu bloques l'essentiel et places une contre-attaque cinglante (-${counterDmg}).`; },60);
    return;
  }
  const dodgeChance = state.hakiObsUnlocked ? Math.min(40, Math.round(state.hakiObs*0.8)) : 0;
  if(Math.random()*100 < dodgeChance){
    sfx('success'); spawnFloat('Esquive !','var(--teal)'); showStatusIcon('💨','player');
    renderCombat();
    setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = "Ton instinct perçoit l'attaque avant qu'elle n'arrive — esquive totale !"; },60);
    return;
  }
  const move = pick(c.enemy.moves);
  let dmg = Math.round((move.mult*c.enemy.power)*(0.85+Math.random()*0.3));
  if(c.enemy.debuffTurns>0){ dmg = Math.round(dmg*0.5); c.enemy.debuffTurns--; }
  dmg = Math.max(2, dmg - Math.round(currentPower(state)*0.1));
  if(c.defBoost){ dmg = Math.round(dmg*(1-c.defBoost)); c.defBoost=0; }
  state.vie = clamp(state.vie-dmg,0,vieMax(state));
  if(dmg>14) shake();
  hitFlash('player');
  spawnFloat(`-${dmg} vie`,'#a13c3c');
  c.combo = 0;
  if(state.vie<=0) return endCombatDefeat();
  renderCombat();
  setTimeout(()=>{ const el=$('#combatLog'); if(el) el.textContent = pickFrais(COMBAT_LOG_ENNEMI,'logEnnemi')(c.label, move)+` (-${dmg})`; }, 60);
}
function usePotionInCombat(nom){
  const idx = state.sac.findIndex(it=>it.nom===nom); if(idx<0) return;
  const item = state.sac[idx]; state.sac.splice(idx,1); sfx('success');
  if(item.type==='potion'){ state.vie=clamp(state.vie+item.soin,0,vieMax(state)); if(item.moralBonus) state.moral=clamp(state.moral+item.moralBonus,0,10); spawnFloat(`+${item.soin} vie`,'var(--teal)'); }
  else if(item.type==='ration'){ state.vivres=clamp(state.vivres+item.vivres,0,10); if(item.moralBonus) state.moral=clamp(state.moral+item.moralBonus,0,10); spawnFloat(`+${item.vivres} vivres`,'var(--teal)'); }
  else if(item.type==='buff'){ state._buffDmg = item.dmgBonus; spawnFloat(`+${item.dmgBonus} dégâts !`,'var(--or)'); }
  renderCombat();
}
function tryFleeCombat(){
  const bonusFuite = ((state.competences.vitesse?.vi6||0)>=1) ? 0.18 : 0;
  const chance = clamp(0.3+state.vitesse/40+bonusFuite,0.1,0.92);
  if(Math.random()<chance){ sfx('success'); combatCtx.onLose && combatCtx.onLose('fuite'); combatCtx=null; setScene('calm'); finirTour({txt:"Tu fuis le combat sans dommage majeur.", bad:true}); }
  else{ sfx('fail'); $('#combatLog').textContent = "Fuite manquée !"; enemyTurn(); }
}
function endCombatVictory(){
  const c = combatCtx;
  const r = gainRecompense(c.rewardBounty);
  state.moral = clamp(state.moral+c.moralDelta,0,10);
  state.force = clamp(state.force+rnd(1,3),0,999); state.maitrise = clamp(state.maitrise+rnd(1,2),0,999);
  gainXP(Math.round(c.rewardBounty/9) + (c.important?40:0));
  gainAffinite('roi',1);
  const typesEquip = state.equip.armes.map(a=>a.type);
  if(typesEquip.includes('sabre')) gainAffinite('epeiste',2); if(typesEquip.includes('tir')) gainAffinite('sniper',2);
  veil('gold'); sfx('coin'); spawnFloat(`+₿${r.berry}`,'var(--sang)');
  ajouterLog(`Triomphe face à ${c.label} — ${primeLabel(state)} +${r.prime||0}, Berry +${r.berry}.`);
  const chestMsg = chestRoll(); if(chestMsg) ajouterLog(chestMsg);
  const onWin = c.onWin; combatCtx=null; setScene('calm');
  if(onWin) onWin();
  finirTour({txt:`Victoire face à ${c.label} ! +₿${r.berry}${r.prime?` • ${primeLabel(state)} +${r.prime}`:''}${chestMsg?' 🎁':''}`, bad:false});
}
function endCombatDefeat(){
  const c = combatCtx; const pp = currentPower(state); const gap = c.enemy.power-pp;
  const deathRoll = (c.important ? (gap>pp*0.6?0.58:0.24) : (gap>pp*1.2?0.35:0.05)) * (state._volonteD?0.65:1);
  veil('red'); sfx('death');
  if(Math.random()<deathRoll){
    state.vivant=false;
    state.causeMort = `${c.label} s'est révélé trop puissant : ta légende s'achève ici, à ${pp} de puissance contre ${c.enemy.power}.`;
    ajouterLog(`Vaincu face à ${c.label}.`); combatCtx=null; return ecranFin();
  }
  state.vie = clamp(Math.round(vieMax(state)*0.15),1,vieMax(state));
  const perte = Math.round(state.berry*0.15); state.berry = Math.max(0,state.berry-perte);
  state.moral = clamp(state.moral-2,0,10);
  ajouterLog(`K.O. face à ${c.label}. Tu te réveilles affaibli, dépouillé de ₿${perte}.`);
  const onLose = c.onLose; combatCtx=null; setScene('calm');
  if(onLose) onLose('ko');
  finirTour({txt:`K.O. face à ${c.label}. -₿${perte}, vie critique.`, bad:true});
}

/* ===================== ACTIONS PERMANENTES ===================== */
function entrainer(type, bonusMult){
  bonusMult = bonusMult||1;
  const s = state; if(s.vivres<=0) return "Pas assez de vivres pour s'entraîner.";
  s.vivres=clamp(s.vivres-1,0,10);
  if(type==='force'){
    const gain = Math.max(1, Math.round((4-s.force/35)*bonusMult)); s.force=clamp(s.force+gain,0,999);
    if(Math.random()<0.4) s.vitesse=clamp(s.vitesse+1,0,999);
    gainAffinite('roi',1); sfx('hit');
    if(Math.random()<0.06){ s.vie=clamp(s.vie-rnd(3,8),0,vieMax(s)); return `Entraînement intense (+${gain} Force) mais blessure légère.`; }
    return `Entraînement acharné : +${gain} Force.`;
  } else {
    const cle = type==='obs' ? 'hakiObs' : 'hakiArm';
    const gain = Math.max(1, Math.round((4-s[cle]/35)*bonusMult)); s[cle]=clamp(s[cle]+gain,0,999); gainAffinite('revolution',1); sfx('success');
    return `Méditation du Haki ${type==='obs'?"d'Observation":"d'Armement"} : +${gain}.`;
  }
}
function reposer(){ state.vie=clamp(state.vie+rnd(8,18),0,vieMax(state)); state.moral=clamp(state.moral+1,0,10); return "L'équipage se repose et reprend des forces."; }
function fruitCost(f){ return {rare:2000, epique:4500, legendaire:10000}[f.rarete] || 1500; }
function ajouterFruitAuSac(f){
  if(state.sac.filter(it=>it.type==='fruit').length>=6){ state.berry += Math.round(fruitCost(f)/2); ajouterLog(`Trop de fruits déjà stockés — celui-ci est revendu directement (+₿${Math.round(fruitCost(f)/2)}).`); return; }
  state.sac.push({...f, type:'fruit', cost:fruitCost(f)});
}
function chercherFruit(){
  if(Math.random()<0.012){ const f=pick(FRUITS.filter(x=>x.rarete!=='legendaire')); ajouterFruitAuSac(f); sfx('chest'); return `Tu découvres un fruit étrange : le ${f.nom} (${f.type}, ${f.desc}) ! Il rejoint ton sac.`; }
  return null;
}
function mangerFruit(idx){
  const f = state.sac[idx]; if(!f || f.type!=='fruit') return;
  if(state.fruit){ state.vivant=false; sfx('death'); veil('red'); state.causeMort=`Un corps ne peut porter deux Fruits du Démon. Le ${f.nom} déchire le tien de l'intérieur.`; ajouterLog("Mort en dévorant un second Fruit du Démon."); renderInventaire(); return; }
  state.fruit={nom:f.nom, type:f.type, desc:f.desc, bonus:f.bonus, rarete:f.rarete};
  state.sac.splice(idx,1);
  sfx('fanfare'); veil('gold'); ajouterLog(`Dévore le ${f.nom} (${f.desc}) — puissant, mais impossible de nager désormais.`);
  reagirEquipage();
  renderInventaire();
}
function recruiterAction(){
  const c = pick(RECRUES);
  const bonusCharisme = ((state.competences.charisme?.ch6||0)>=1) ? 0.15 : 0;
  const chance = clamp(0.35+state.moral/25+Math.min(state.bounty+state.berry,3000)/6000+(state.voie?.id==='civil'?0.1:0)+bonusCharisme, 0.15,0.92);
  if(Math.random()<chance){
    const traitre = Math.random()<0.07;
    state.crewMembers.push({nom:c.nom, role:c.role, traitre});

    gainAffinite(c.affinite,2); sfx('success');
    return `${c.nom} (${c.role}) rejoint l'équipage !`;
  }

// Maîtrise : mini-jeu de séquence, thématisé selon le style de combat équipé
const SEQ_ICONES = {sabre:['🗡️','⚔️','🌀','💥'], lance:['🔱','⚡','🌀','💥'], hache:['🪓','💥','🌀','🔥'], tir:['🎯','💨','🌀','⚡'], fleau:['⛓️','💥','🌀','🔥'], poing:['👊','💥','🌀','⚡']};
function ouvrirMinigameMaitrise(){
  const style = state.equip.armes[0]?.type || 'poing';
  const icones = SEQ_ICONES[style]||SEQ_ICONES.poing;
  const seq = [rnd(0,3),rnd(0,3),rnd(0,3),rnd(0,3)];
  let phase='montre', idx=0, saisie=[];
  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">Maîtrise — ${STYLES_ARME[style]}</div></header>
    <main class="scene-calm">
      <div class="recit" id="seqTexte">Mémorise la séquence...</div>
      <div style="display:flex; gap:10px; justify-content:center; margin:20px 0;" id="seqZone">
        ${icones.map((ic,i)=>`<div class="skill-circle" data-seq="${i}" style="--nodecolor:var(--sang); width:54px; height:54px; font-size:24px;">${ic}</div>`).join('')}
      </div>
      <div class="repere" style="text-align:center;" id="seqProg"></div>
    </main>`;
  const cercles = document.querySelectorAll('[data-seq]');
  function flash(i, cb){
    cercles[i].classList.add('selected'); sfx('click');
    setTimeout(()=>{ cercles[i].classList.remove('selected'); cb&&cb(); }, 420);
  }
  function montrer(){
    if(idx>=seq.length){ phase='joue'; idx=0; $('#seqTexte').textContent="À toi ! Reproduis la séquence."; cercles.forEach(c=>c.addEventListener('click', onClickSeq)); return; }
    flash(seq[idx], ()=>{ idx++; setTimeout(montrer, 200); });
  }
  function onClickSeq(e){
    if(phase!=='joue') return;
    const i = parseInt(e.currentTarget.dataset.seq);
    flash(i);
    saisie.push(i);
    $('#seqProg').textContent = `${saisie.length}/${seq.length}`;
    if(saisie[saisie.length-1] !== seq[saisie.length-1]){ return terminerSeq(false); }
    if(saisie.length>=seq.length) return terminerSeq(true);
  }
  function terminerSeq(reussite){
    cercles.forEach(c=>c.removeEventListener('click', onClickSeq));
    const mult = reussite?2.0:0.6;
    const t = entrainer('force', mult); // la maîtrise progresse via l'entraînement de style
    state.maitrise = clamp(state.maitrise + (reussite?4:1), 0, 999);
    gainXP(reussite?24:10);
    ajouterLog(`Entraînement de maîtrise (${STYLES_ARME[style]}) — ${reussite?'séquence parfaite':'erreur dans la séquence'}.`);
    sfx(reussite?'success':'fail'); if(reussite) spawnFloat('Maîtrise +4 !','var(--or)');
    avancerJour(); finirTour({txt: reussite? "Séquence parfaite — ta maîtrise progresse nettement." : "Tu perds le fil de la séquence, la maîtrise progresse à peine.", bad:!reussite});
  }
  setTimeout(montrer, 700);
}

function checkDreamReveal(){
  if(!state.reveFixe && !state.reveRefuse && state.day>=state.reveilSeuil){

    for(const k in state.affinites){ if(state.affinites[k]>val){ val=state.affinites[k]; top=k; } }
    if(val<=0) top = pick(Object.keys(state.affinites));
    const camp = CAMPS.find(c=>c.id===top);
    return {lieu:"Un instant de clarté", texte:`Après tout ce chemin, un rêve se dessine : ${camp.label}. ${camp.desc}`,
      choix:[
        {t:"Embrasser ce destin", fx:s=>{ s.reveFixe=camp; for(const k in camp.bonus){ s[k]=clamp((s[k]||0)+camp.bonus[k],0,999); } sfx('fanfare'); veil('gold'); reagirEquipage(); }, log:`Le rêve de ${state.nom} est scellé : ${camp.label}.`},

function buildArc(arc){
  const boss = ADVERSAIRES_LEGENDAIRES[arc.lieu];
  const nomBoss = boss ? pick(boss) : null;
  const retry = state._arcRetry === arc.lieu;
  const choix = [ {t:"⚔️ Charger de front, quitte ou double", cls:'risque'}, {t:"🎯 Manœuvre rusée et calculée", cls:''}, {t:"🕊️ Éviter l'affrontement direct", cls:''} ];
  return { lieu:arc.lieu,
    texteHaut: retry ? `Après avoir reculé pour se préparer, l'équipage revient au complet face à ${nomBoss||'cette menace'} sur ${arc.lieu}. Cette fois, il faudra faire mieux.`
      : (nomBoss ? `L'équipage atteint ${arc.lieu}. ${nomBoss} se dresse devant toi — un adversaire dont le nom seul fait trembler Grand Line.`
                 : `L'équipage atteint ${arc.lieu}. Une menace à la hauteur de ta légende s'y dresse.`),
    choixHTML: choix.map((c,i)=>`<button class="choix-btn ${c.cls}" data-arc="${i}">${c.t}</button>`).join(''), nomBoss };
}
function launchArcCombat(arc, i){
  const idx = state.arcsFaits; const rewardBase = Math.round(320+idx*420); const req = requiredPower(state.day, state.totalDays);
  const opts = [ {mult:1.35, bounty:Math.round(rewardBase*1.8), moral:2, aff:'roi'},
                 {mult:1.05, bounty:rewardBase, moral:1, aff:'cartographe'},
                 {mult:0.4, bounty:Math.round(rewardBase*0.35), moral:-2, aff:'cartographe'} ];
  const o = opts[i]; gainAffinite(o.aff,2);
  const boss = ADVERSAIRES_LEGENDAIRES[arc.lieu]; const nomBoss = boss? pick(boss) : arc.lieu;
  startCombat({nom:nomBoss, enemyBase:Math.round(req*o.mult)}, {
    important:true, rewardBounty:o.bounty, moralDelta:o.moral,
    onWin:()=>{ state.arcsFaits++; state._arcRetry=null; avancerJour(); if(Math.random()<0.3){ state.crewMembers.push({nom:pick(["Sōra","Vek","Ines","Marlon"]), role:"Allié de fortune", traitre:Math.random()<0.07}); ajouterLog("Un allié rejoint l'équipage après cette épreuve."); } sfx('fanfare'); reagirEquipage(); },
    onLose:()=>{
      const recul = 10;
      state.day = Math.max(1, state.day - recul);
      state.vie = vieMax(state);
      state._arcRetry = arc.lieu;
      ajouterLog(`Défaite face à ${nomBoss} — l'équipage recule de ${recul} jours en mer pour reprendre des forces avant une nouvelle tentative. Vie restaurée au complet.`);
      sfx('fail'); reagirEquipage();
    }
  });
}
function buildNormal(ev){
  if(ev.type==='encounter'){
    return { lieu:ev.lieu, texteHaut:ev.texte,
      choixHTML:`<button class="choix-btn risque" data-choice="0">⚔️ Combattre ${ev.nom}</button><button class="choix-btn" data-choice="1">🏃 Fuir sans combattre</button>`,
      evenement: ev };
  }
  if(ev.type==='naval'){
    return { lieu:`En mer, près de ${ev.lieu}`, texteHaut:ev.texte,
      choixHTML:`<button class="choix-btn risque" data-choice="0">🚢⚔️ Engager le combat naval</button><button class="choix-btn" data-choice="1">🏃 Virer de bord et fuir</button>`,
      evenement: ev };
  }
  return { lieu:ev.lieu, texteHaut:ev.texte, choixHTML: ev.choix.map((c,i)=>`<button class="choix-btn" data-choice="${i}">${c.t}</button>`).join(''), evenement: ev };

function resolverNormal(ev, i){
  if(ev.type==='encounter'){
    if(i===0){
      const req = requiredPower(state.day, state.totalDays);
      const rewardBounty = Math.round(180+req*2.8);
      startCombat(ev, {important:false, rewardBounty, moralDelta:1, onWin:()=>avancerJour(), onLose:()=>avancerJour()});
      return;
    }
    state.moral=clamp(state.moral-1,0,10); state.vivres=clamp(state.vivres-1,0,10); gainAffinite('cartographe',1);
    ajouterLog(`Fuit devant ${ev.nom}.`); avancerJour(); finirTour({txt:`Tu fuis face à ${ev.nom}.`, bad:true}); return;
  }
  if(ev.type==='naval'){
    if(i===0){ startNavalCombat(); return; }
    state.moral=clamp(state.moral-1,0,10); state.vivres=clamp(state.vivres-1,0,10);
    ajouterLog("Vire de bord pour éviter un affrontement naval."); avancerJour(); finirTour({txt:"Tu évites le navire ennemi de justesse.", bad:true}); return;
  }
  const c = ev.choix[i]; const res = c.fx(state); const trouve = chercherFruit();
  ajouterLog(res || "Un choix sans conséquence notable."); if(trouve) ajouterLog(trouve);
  reagirEquipage();
  avancerJour(); finirTour({txt:(res||"...")+(trouve?" "+trouve:''), bad:false});
}

function acheter(item, slot){
  const prix = Math.round(prixActuel(item.cost)*(1-(state._remise||0)));
  if(state.berry<prix) return;
  state.berry -= prix; state._remise = 0; sfx('coin');
  if(slot==='potion'){ if(state.sac.length>=10){ state.berry+=Math.round(prixActuel(state.sac[0].cost)/2); state.sac.shift(); } state.sac.push(item); ajouterLog(`Achète ${item.nom} au marché (₿${prix}).`); renderMarche(); return; }
  if(slot==='arme'){
    if(state.equip.armes.length>=MAX_ARMES){ const ancienne=state.equip.armes.shift(); if(state.sac.length>=10){ state.berry+=Math.round(prixActuel(state.sac[0].cost)/2); state.sac.shift(); } state.sac.push(ancienne); }
    state.equip.armes.push(item);
    ajouterLog(`Achète et équipe ${item.nom} au marché (₿${prix}).`);
    renderMarche(); return;
  }
  const ancien = state.equip[slot];
  if(ancien){ if(state.sac.length>=10){ state.berry+=Math.round(prixActuel(state.sac[0].cost)/2); state.sac.shift(); } state.sac.push(ancien); }
  state.equip[slot] = item;
  ajouterLog(`Achète ${item.nom} au marché (₿${prix}).`);
  renderMarche();
}
function forger(recette){
  for(const m in recette.need){ if((state.materiaux[m]||0) < recette.need[m]) return; }
  if(state.berry < recette.cost) return;
  for(const m in recette.need){ state.materiaux[m] -= recette.need[m]; }
  state.berry -= recette.cost; sfx('legendaire'); veil('gold');
  if(state.sac.length>=10) state.sac.shift();
  state.sac.push(recette.result);
  ajouterLog(`Forge ${recette.result.nom} !`);
  renderMarche();
}

function renderInventaire(){  setScene('port');

  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">🎒 Inventaire ${sonBtnHTML()}</div><div class="jour">₿${state.berry}</div></header>
    <main class="scene-port">
      <div class="section-titre">Armes équipées (${state.equip.armes.length}/${MAX_ARMES})</div>
      ${state.equip.armes.length? state.equip.armes.map((it,i)=>`<div class="marche-item rarete-${it.rarete||'commune'}"><div class="nom">${it.nom}<br><span class="desc">${itemDesc(it)}</span></div><button data-desequip="${i}">Déséquiper</button></div>`).join('') : `<div class="repere">Aucune arme équipée — combat à mains nues.</div>`}
      <div class="section-titre">Armure & Accessoire</div>
      <div class="marche-item"><div class="nom">Armure</div><div>${state.equip.armure?state.equip.armure.nom:'—'}</div></div>
      <div class="marche-item"><div class="nom">Accessoire</div><div>${state.equip.accessoire?state.equip.accessoire.nom:'—'}</div></div>

      <div class="section-titre">Objets et équipements (${equipements.length})</div>
      ${equipements.length? equipements.map((it)=>{ const idx=state.sac.indexOf(it); return `<div class="marche-item rarete-${it.rarete||'commune'}"><div class="nom">${it.nom}<br><span class="desc">${itemDesc(it)}</span></div><div>${TYPES_ARME.includes(it.type)&&state.equip.armes.length>=MAX_ARMES?'':'<button data-invequip="'+idx+'">Équiper</button> '}<button class="vendre" data-invsell="${idx}">Vendre</button></div></div>`; }).join('') : `<div class="repere">Ton sac d'équipement est vide.</div>`}

      <div class="section-titre">Fruits du Démon en réserve (${fruits.length}/6)</div>
      ${fruits.length? fruits.map((it)=>{ const idx=state.sac.indexOf(it); return `<div class="marche-item rarete-${it.rarete||'epique'}"><div class="nom">${it.nom}<br><span class="desc">${it.type} — ${it.desc}</span></div><div><button data-manger="${idx}">Manger</button> <button class="vendre" data-invsell="${idx}">Vendre ₿${Math.round(prixActuel(it.cost)/2)}</button></div></div>`; }).join('') : `<div class="repere">Aucun fruit stocké pour l'instant.</div>`}

      <div class="section-titre">Consommables (${consommables.length})</div>
      ${consommables.length? consommables.map((it)=>{ const idx=state.sac.indexOf(it); return `<div class="marche-item rarete-${it.rarete||'commune'}"><div class="nom">${it.nom}<br><span class="desc">${itemDesc(it)}</span></div><div><button data-invuse="${idx}">Utiliser</button> <button class="vendre" data-invsell="${idx}">Vendre</button></div></div>`; }).join('') : `<div class="repere">Aucun consommable pour l'instant.</div>`}

      <div class="section-titre">Matériaux (pour la forge)</div>
      ${matEntries.length? matEntries.map(([m,n])=>`<div class="marche-item"><div class="nom">${m}</div><div>×${n}</div></div>`).join('') : `<div class="repere">Aucun matériau récolté pour l'instant — trouvés dans les coffres.</div>`}

      <div class="ff-row" style="margin-top:14px;"><button class="ff-btn" id="retourInv">← Retour</button></div>
    </main>`;
  $('#sonBtn')?.addEventListener('click', e=>{ e.stopPropagation(); toggleSon(); renderInventaire(); });
  document.querySelectorAll('[data-invequip]').forEach(btn=>btn.addEventListener('click',()=>equiperDepuisSac(parseInt(btn.dataset.invequip), renderInventaire)));
  document.querySelectorAll('[data-invsell]').forEach(btn=>btn.addEventListener('click',()=>vendre(parseInt(btn.dataset.invsell), renderInventaire)));
  document.querySelectorAll('[data-invuse]').forEach(btn=>btn.addEventListener('click',()=>utiliserObjet(parseInt(btn.dataset.invuse))));
  document.querySelectorAll('[data-desequip]').forEach(btn=>btn.addEventListener('click',()=>desequiperArme(parseInt(btn.dataset.desequip), renderInventaire)));
  document.querySelectorAll('[data-manger]').forEach(btn=>btn.addEventListener('click',()=>mangerFruit(parseInt(btn.dataset.manger))));

function itemDesc(it){
  if(it.type==='potion') return `Soigne ${it.soin} vie${it.moralBonus?` +${it.moralBonus} moral`:''}`;
  if(it.type==='ration') return `+${it.vivres} vivres${it.moralBonus?` +${it.moralBonus} moral`:''}`;
  if(it.type==='buff') return `+${it.dmgBonus} dégâts sur la prochaine attaque`;
  return `${it.bonus.force?'+'+it.bonus.force+' Force ':''}${it.bonus.vitesse?'+'+it.bonus.vitesse+' Vitesse ':''}${it.bonus.vie?'+'+it.bonus.vie+' Vie':''}`;
}
function renderMarche(){
  setScene('port');
  const tabs = [{id:'armes',l:'Armes',data:ARMES,slot:'arme'},{id:'armures',l:'Armures',data:ARMURES,slot:'armure'},
    {id:'accessoires',l:'Accessoires',data:ACCESSOIRES,slot:'accessoire'},{id:'consommables',l:'Consommables',data:CONSOMMABLES,slot:'potion'},
    {id:'forge',l:'⚒️ Forge',data:null,slot:null},{id:'quetes',l:'📜 Contrats',data:null,slot:null}];
  const t = tabs.find(x=>x.id===ongletMarche);
  const matHTML = Object.keys(state.materiaux).filter(m=>state.materiaux[m]>0).map(m=>`${m} ×${state.materiaux[m]}`).join(' · ') || 'aucun';
  let corpsHTML;
  if(t.id==='forge'){
    corpsHTML = `<div class="repere">Tes matériaux : ${matHTML}</div>` + RECETTES.map(r=>{
      const peut = Object.keys(r.need).every(m=>(state.materiaux[m]||0)>=r.need[m]) && state.berry>=r.cost;
      const needStr = Object.entries(r.need).map(([m,n])=>`${m} ×${n}`).join(', ');
      return `<div class="marche-item rarete-${r.result.rarete}"><div><div class="nom">${r.nom}</div><div class="desc">${needStr} + ₿${r.cost} → ${itemDesc(r.result)}</div></div><button data-forge="${r.nom}" ${peut?'':'disabled'}>Forger</button></div>`;
    }).join('');
  } else if(t.id==='quetes'){
    if(!quetesDisponibles) quetesDisponibles = genererQuetes();
    corpsHTML = quetesDisponibles.length ? quetesDisponibles.map((q,i)=>`<div class="marche-item"><div><div class="nom">${q.titre}</div><div class="desc">${q.desc} — récompense ≈ ₿${q.recompense}</div></div><button data-quete="${i}">Accepter</button></div>`).join('') : `<div class="repere">Plus de contrats disponibles pour cette escale.</div>`;
  } else {
    corpsHTML = t.data.map(it=>{ const prix = Math.round(prixActuel(it.cost)*(1-(state._remise||0)));
      return `<div class="marche-item rarete-${it.rarete}"><div><div class="nom">${it.nom}</div><div class="desc">${itemDesc(it)} · ${it.rarete}</div></div><button data-buy="${t.slot}" data-nom="${it.nom}" ${state.berry<prix?'disabled':''}>₿${prix}</button></div>`;
    }).join('');
  }
  content.innerHTML = `
    <header class="bar"><div class="titre-jeu">⚓ Marché ${sonBtnHTML()}</div><div class="jour">₿${state.berry}${state._remise?' · remise active':''}</div></header>
    <main class="scene-port">
      <div class="tabs">${tabs.map(x=>`<div class="tab-btn ${x.id===ongletMarche?'active':''}" data-tab="${x.id}">${x.l}</div>`).join('')}</div>
      ${corpsHTML}
      ${state.sac.length ? `<div class="section-titre">Ton sac (${state.sac.length}) — équiper ou vendre</div>${state.sac.map((it,i)=>`<div class="marche-item rarete-${it.rarete||'commune'}"><div class="nom">${it.nom}</div><div>${!it.type?`<button data-equip="${i}">Équiper</button> `:''}<button class="vendre" data-sell="${i}">Vendre ₿${Math.round(prixActuel(it.cost)/2)}</button></div></div>`).join('')}` : ''}
      <div class="perm-row" style="margin-top:12px;"><button class="perm-btn" id="btnMarchander" ${state._remise?'disabled':''}>🤝 Marchander (mini-jeu)</button></div>
      <div class="ff-row" style="margin-top:12px;"><button class="ff-btn" id="retourMer">⛵ Retour en mer</button></div>

/* ===================== AUTO-AVANCE ===================== */
function autoAvancer(nb){
  let count=0;
  while(count<nb && state.vivant && state.day<=state.totalDays){
    const arc = nextArc(); if(arc) break;
    const scripted = getScriptedEvent();
    if(scripted){ const c = scripted.choix[0]; c.fx(state); ajouterLog(c.log); avancerJour(); count++; continue; }
    const req = requiredPower(state.day, state.totalDays); const pp = currentPower(state);
    if(state.vie<40*vieMax(state)/100){ ajouterLog(reposer()); }
    else if(state.vivres<=1){ const ev=genCalm(); const c=ev.choix[0]; const r=c.fx(state); ajouterLog(r||"Ravitaillement."); }
    else if(state.crewMembers.length<2 && Math.random()<0.3){ ajouterLog(recruiterAction()); }
    else if(pp < req*0.85){ ajouterLog(entrainer(Math.random()<0.7||!state.hakiObsUnlocked?'force':'obs')); }
    else {
      const ev = Math.random()<0.5 ? genEncounter() : genCalm();
      if(ev.type==='encounter'){
        const dc = 0.05+Math.max(0,ev.enemyBase-pp)*0.011;
        if(Math.random()<dc*0.4){ state.vie=clamp(Math.round(vieMax(state)*0.15),1,vieMax(state)); ajouterLog(`K.O. auto face à ${ev.nom}.`); }
        else { const rewardBounty=Math.round(180+req*2.8); const r=gainRecompense(rewardBounty); state.force=clamp(state.force+rnd(1,3),0,999); gainXP(Math.round(rewardBounty/9)); ajouterLog(`Victoire auto face à ${ev.nom} (+₿${r.berry}).`); const cm=chestRoll(); if(cm) ajouterLog(cm); }
      } else { const c = pick(ev.choix); const r=c.fx(state); ajouterLog(r||"..."); }
      const trouve = chercherFruit(); if(trouve) ajouterLog(trouve);
    }
    avancerJour(); count++;
    if(!state.vivant) break;
  }
  finirTour({txt:`⏩ ${count} jour(s) écoulé(s) automatiquement.`, bad:false});
}

/* ===================== FIN ===================== */
async function ecranFin(){
  let sceau, titre, texte, avis;
  const pp = currentPower(state);
  const score = scoreFinal(state);
  const revLabel = state.reveFixe ? state.reveFixe.label : "un rêve jamais scellé";
  sfx(state.vivant ? 'fanfare' : 'death'); AudioFX.stopMusic();
  const eclatsGagnes = Math.max(5, Math.round(score/60 + pp*1.5 + state.age));
  metaEclats += eclatsGagnes; await saveMeta();
  const infosBase = `Âge final : ${state.age} ans • Berry : ₿${state.berry} • ${primeLabel(state)} : ${state.bounty} • Puissance : ${pp} • Équipage : ${state.crewMembers.length}`;

  if(!state.vivant){
    sceau="LÉGENDE BRISÉE"; titre=`${state.nom} s'éteint sur Grand Line, à ${state.age} ans`;
    texte = state.causeMort || "Ton voyage s'achève brutalement.";
    avis=`Jour ${state.day} • Berry : ₿${state.berry} • ${primeLabel(state)} : ${state.bounty} • Puissance : ${pp} • Équipage : ${state.crewMembers.length}`;
  } else if(score>=4000 && pp>=requiredPower(state.totalDays,state.totalDays)*0.9){
    sceau="LÉGENDE VIVANTE"; titre=`${state.nom} atteint Laugh Tale et devient ${revLabel}`;
    texte=`Force, Haki et volonté se sont conjugués jusqu'au bout. Ton nom résonnera aussi longtemps que la mer existera.`;
    avis=`${infosBase} • Fruit : ${state.fruit?state.fruit.nom:'aucun'}`;
  } else if(score>=1500){
    sceau="EMPEREUR EN DEVENIR"; titre=`${state.nom} rejoint les puissances qui comptent`;
    texte=`Ta réputation fait trembler les bureaux de la Marine. Le sommet reste loin, mais plus personne ne doute de toi.`;
    avis=infosBase;
  } else if(state.moral>=8){
    sceau="CAPITAINE BIEN-AIMÉ"; titre=`${state.nom} n'a jamais visé la gloire — seulement la famille`;
    texte=`Certaines légendes ne se mesurent pas en berrys.`;
    avis=`${infosBase} • Moral : ${state.moral}/10`;
  } else {
    sceau="VOYAGE INACHEVÉ"; titre=`${state.nom} accoste, loin encore de Laugh Tale`;
    texte=`Le temps a manqué, ou la puissance. L'histoire retiendra une tentative honnête vers ${revLabel}.`;
    avis=infosBase;
  }
  content.innerHTML = `
    <div class="fin">
      <div class="sceau">${sceau}</div>
      <h2>${titre}</h2>
      <p>${texte}</p>
      <div class="avis">${avis}</div>
      <div class="eclats">💠 +${eclatsGagnes} Éclats de Légende (total : ${metaEclats})</div>
      <button id="rejouer">Reprendre la mer</button>
    </div>`;
  $('#rejouer').addEventListener('click', ecranDepart);
}

/* ===================== INIT ===================== */
(async ()=>{ await loadMeta(); ecranDepart(); })();
</script>
